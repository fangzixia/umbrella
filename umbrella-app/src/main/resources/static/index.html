<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Umbrella · 图谱</title><link rel="stylesheet" href="showcase.css"><script src="vendor/cytoscape.min.js"></script><script src="vendor/layout-base.js"></script><script src="vendor/cose-base.js"></script><script src="vendor/cytoscape-cose-bilkent.js"></script><script type="module" src="showcase.js"></script></head>
<body><header class="page-header"><a class="brand" href="./"><span>◒</span> umbrella <b>/</b> <small>图谱</small></a><div class="page-header-center"><h1 id="graph-name">加载图谱…</h1><span id="counts"></span></div><div class="page-header-right"><span id="source" class="page-status"><span class="status-dot" id="status-dot" aria-hidden="true"></span><span id="status-text">连接中…</span></span><div class="legend" aria-hidden="false"><span><i class="agent-dot"></i>Agent</span><span><i></i>业务</span></div></div></header><main><section class="workspace"><div class="canvas"><div id="graph-container" role="application" aria-label="关系图谱，点击节点查看信息"></div><div id="empty" hidden>图谱中暂无节点</div><div class="canvas-footer"><span id="canvas-hint">力导向 · 滚轮缩放 · 拖动画布</span><div class="canvas-footer-actions"><button id="reload" type="button" class="icon-btn" title="刷新图谱" aria-label="刷新图谱">↻</button><button id="reset" type="button">适应画布 ↗</button><button id="open-inspector" type="button" class="icon-btn" title="节点面板" aria-label="节点面板">☰</button></div></div></div></section><aside id="inspector-panel"><div class="inspector-tabs" role="tablist" aria-label="节点面板"><button id="master-chat-tab" role="tab" aria-selected="false" aria-controls="chat-pane" tabindex="-1">总控对话</button><button id="chat-tab" role="tab" aria-selected="false" aria-controls="chat-pane" tabindex="-1">节点对话</button><button id="info-tab" role="tab" aria-selected="false" aria-controls="details" tabindex="-1">节点信息</button><button id="inspector-close" type="button" class="inspector-close icon-btn" title="收起" aria-label="收起面板">×</button></div><div id="details" role="tabpanel" aria-labelledby="info-tab" hidden></div><section id="chat-pane" role="tabpanel" aria-labelledby="chat-tab" hidden><div class="chat-heading"><div><span class="overline">NODE AGENT</span><h2 id="chat-target">选择一个节点</h2></div><button id="clear-chat" type="button" title="清空当前节点的对话">新对话</button></div><div id="chat-messages" role="log" aria-label="当前节点的对话记录" aria-live="polite"></div><form id="chat-form"><label for="chat-input" class="sr-only">发送给当前节点的消息</label><textarea id="chat-input" rows="3" maxlength="8000" placeholder="向选中的节点提问…"></textarea><div class="composer-footer"><span>Enter 发送 · Shift + Enter 换行</span><button id="send-chat" type="submit">发送 ↑</button></div><p id="chat-status" role="status"></p></form></section></aside></main></body></html>
